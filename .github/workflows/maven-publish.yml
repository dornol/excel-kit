name: Maven Central release
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: maven-central-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: dornol

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Verify release version and consumers before accessing signing credentials
        run: |
          ./gradlew verifyReleaseVersion :kit:build :excel-kit-spring:build :kit:poiCompatibilityTest --no-daemon
          scripts/verify-consumers.sh

      - name: Write GPG key to file
        run: |
          mkdir -p ~/.gradle
          echo "${{ secrets.SIGNING_SECRET_KEY }}" | base64 --decode > ~/.gradle/secring.gpg


      - name: Set up gradle.properties
        run: |
          echo "mavenCentralUsername=${{ secrets.MAVEN_CENTRAL_USERNAME }}" >> ~/.gradle/gradle.properties
          echo "mavenCentralPassword=${{ secrets.MAVEN_CENTRAL_PASSWORD }}" >> ~/.gradle/gradle.properties
          echo "signing.password=${{ secrets.SIGNING_PASSWORD }}" >> ~/.gradle/gradle.properties
          echo "signing.keyId=${{ secrets.SIGNING_KEYID }}" >> ~/.gradle/gradle.properties
          echo "signing.secretKeyRingFile=$(echo ~/.gradle/secring.gpg)" >> ~/.gradle/gradle.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Publish
        run: |
          ./gradlew :kit:publishAndReleaseToMavenCentral :excel-kit-spring:publishAndReleaseToMavenCentral --no-daemon

      - name: Verify Maven Central visibility
        timeout-minutes: 65
        run: |
          scripts/verify-maven-central.sh "${GITHUB_REF_NAME#v}"
          scripts/verify-maven-central.sh "${GITHUB_REF_NAME#v}" --artifact-id excel-kit-spring

  github-release:
    needs: build-and-publish
    uses: ./.github/workflows/release.yml
