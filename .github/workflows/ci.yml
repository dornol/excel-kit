name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [ 17, 21, 25 ]

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            ${{ matrix.java-version }}
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build & Test
        run: ./gradlew build --no-daemon -PtestJavaVersion=${{ matrix.java-version }}

      - name: Upload coverage report
        if: always() && matrix.java-version == 17
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: kit/build/reports/jacoco/

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request' && matrix.java-version == 17
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: kit/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 88
          min-coverage-changed-files: 70
          title: "📊 Code Coverage Report"
          update-comment: true

  dependency-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum
            java-version: 17
            poi-version: 5.2.5
            opencsv-version: 5.9
          - name: current
            java-version: 21
            poi-version: 5.5.1
            opencsv-version: 5.12.0
          - name: latest
            java-version: 21
            poi-version: 6.0.0
            opencsv-version: 5.12.0

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            ${{ matrix.java-version }}
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Test ${{ matrix.name }} integration versions
        run: >-
          ./gradlew :kit:test --no-daemon
          -PtestJavaVersion=${{ matrix.java-version }}
          -PpoiVersion=${{ matrix.poi-version }}
          -PopencsvVersion=${{ matrix.opencsv-version }}

  poi-runtime-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Test the same JAR with POI 5 and 6
        run: ./gradlew :kit:poiCompatibilityTest --no-daemon

  locale-compatibility:
    # The library must behave the same under any default locale and time zone: numbers written with native digits
    # (Arabic), a comma as the decimal separator (German), the dotless i (Turkish), a non-Gregorian calendar (Thai),
    # and time zones with daylight saving or a half-hour offset.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - locale: ar-EG
            time-zone: Africa/Cairo
          - locale: de-DE
            time-zone: Europe/Berlin
          - locale: tr-TR
            time-zone: Europe/Istanbul
          - locale: th-TH
            time-zone: Asia/Bangkok
          - locale: en-US
            time-zone: America/New_York
          - locale: hi-IN
            time-zone: Asia/Kolkata
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Test under ${{ matrix.locale }} / ${{ matrix.time-zone }}
        run: >-
          ./gradlew :kit:test :excel-kit-spring:test --no-daemon
          -PtestLocale=${{ matrix.locale }}
          -PtestTimeZone=${{ matrix.time-zone }}

  libreoffice-interop:
    # Opens what the writers produce in a real spreadsheet application. A file POI and the structure checks accept
    # can still be one an application refuses (POI 6 writes ZIP64 data descriptors that LibreOffice cannot read).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc
          command -v soffice
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Open the written workbooks in LibreOffice
        run: ./gradlew :kit:test --tests '*LibreOfficeInteropTest' --no-daemon

  consumer-installation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [17, 21, 25]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            ${{ matrix.java-version }}
          cache: gradle
      - name: Verify isolated consumers of published artifacts
        run: scripts/verify-consumers.sh
