name: Benchmark

on:
  push:
    branches: [ main ]
    paths:
      - 'kit/src/main/**'
      - 'kit/src/test/java/io/github/dornol/excelkit/benchmark/**'
      - 'kit/build.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/benchmark.yml'
      - 'scripts/benchmark_comparison.py'
      - 'scripts/tests/test_benchmark_comparison.py'
  workflow_dispatch:
    inputs:
      repetitions:
        description: Fresh JVM samples on the same runner for noise calibration
        type: choice
        default: '1'
        options: ['1', '5', '10']
  pull_request:
    branches: [main]
    paths:
      - 'kit/src/main/**'
      - 'kit/src/test/java/io/github/dornol/excelkit/benchmark/**'
      - 'kit/build.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/benchmark.yml'
      - 'scripts/benchmark_comparison.py'
      - 'scripts/tests/test_benchmark_comparison.py'

permissions:
  contents: read
  actions: read

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test benchmark comparison logic
        run: python3 -m unittest discover -s scripts/tests -p 'test_benchmark_comparison.py'

      - name: Record benchmark context
        run: python3 scripts/benchmark_comparison.py context --output kit/build/reports/benchmark/context.json

      - name: Run benchmarks
        env:
          REPETITIONS: ${{ inputs.repetitions || '1' }}
        run: |
          case "$REPETITIONS" in 1|5|10) ;; *) exit 1 ;; esac
          mkdir -p kit/build/reports/benchmark/samples
          for sample in $(seq 1 "$REPETITIONS"); do
            ./gradlew :kit:benchmark --rerun-tasks --no-daemon
            cp kit/build/reports/benchmark/resources.csv "kit/build/reports/benchmark/samples/sample-${sample}.csv"
          done

      - name: Calibrate observed variability
        if: inputs.repetitions != '' && inputs.repetitions != '1'
        run: >-
          python3 scripts/benchmark_comparison.py calibrate
          --samples kit/build/reports/benchmark/samples
          --context kit/build/reports/benchmark/context.json
          --output kit/build/reports/benchmark/calibration.json

      - name: Compare with a compatible successful main run
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/benchmark_comparison.py compare
          --current kit/build/reports/benchmark/resources.csv
          --context kit/build/reports/benchmark/context.json
          --output-dir kit/build/reports/benchmark --github
          --calibration docs/benchmarks/calibration.json

      - name: Save benchmark output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: |
            kit/build/reports/tests/benchmark/
            kit/build/reports/benchmark/
