name: Benchmark

on:
  push:
    branches: [ main ]
    paths:
      - 'kit/src/main/**'
      - 'kit/src/test/java/io/github/dornol/excelkit/benchmark/**'
      - 'kit/build.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/benchmark.yml'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'kit/src/main/**'
      - 'kit/src/test/java/io/github/dornol/excelkit/benchmark/**'
      - 'kit/build.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/benchmark.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run benchmarks
        run: ./gradlew :kit:benchmark --no-daemon

      - name: Save benchmark output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: |
            kit/build/reports/tests/benchmark/
            kit/build/reports/benchmark/resources.csv
